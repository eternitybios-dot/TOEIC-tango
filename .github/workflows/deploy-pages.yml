name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/toeic-vocab-app-1945]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - if: steps.pages.outcome != 'success'
        run: |
          echo "GitHub Pages is not enabled yet."
          echo "Open Settings → Pages and set Source to GitHub Actions, then re-run this workflow."
          echo "https://github.com/${{ github.repository }}/settings/pages"
